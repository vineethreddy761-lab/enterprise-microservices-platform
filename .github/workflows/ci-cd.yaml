name: Enterprise CI/CD Pipeline

on:
push:
branches: [ "main", "feature/**" ]
pull_request:
branches: [ "main" ]

jobs:
validate-and-test:
runs-on: ubuntu-latest
steps:
- name: Checkout Code
  uses: actions/checkout@v4

- name: Set up Kubectl
  uses: azure/setup-kubectl@v3
  with:
    version: 'v1.28.0'

- name: Validate Native Kubernetes Manifests (Tiers 1-4)
  run: |
    echo "Validating core native Kubernetes manifests..."
    for tier in k8s/tier1-ingress k8s/tier2-backend k8s/tier3-data k8s/tier4-observability; do
      if [ -d "$tier" ]; then
        echo "Checking $tier..."
        kubectl apply --recursive --dry-run=client -f "$tier/"
      fi
    done

- name: Validate Custom Resource and GitOps Manifests (Tiers 5-6)
  run: |
    echo "Validating YAML structure for custom resource tiers..."
    python3 -c '
    import yaml, glob, sys
    for filepath in glob.glob("k8s/tier*/**/*.yaml", recursive=True):
        try:
            with open(filepath, "r") as f:
                list(yaml.safe_load_all(f))
            print(f"YAML OK: {filepath}")
        except Exception as e:
            print(f"YAML Error in {filepath}: {e}")
            sys.exit(1)
    '

- name: Verify Deployment Script Executable and Syntax
  run: |
    chmod +x scripts/deploy-all.sh
    bash -n scripts/deploy-all.sh
    echo "Master deployment script syntax check passed."
