name: Enterprise CI/CD Pipeline

on:
push:
branches: [ "main", "feature/**" ]
pull_request:
branches: [ "main" ]

jobs:
validate-and-test:
runs-on: ubuntu-latest
steps:
- name: Checkout Code
  uses: actions/checkout@v4

- name: Set up Kubectl
  uses: azure/setup-kubectl@v3
  with:
    version: 'v1.28.0'

- name: Run Manifest Dry-Run Validation Recursively
  run: |
    echo "Validating all Kubernetes manifests recursively in k8s/..."
    kubectl apply --recursive --dry-run=client -f k8s/

- name: Verify Deployment Script Executable and Syntax
  run: |
    chmod +x scripts/deploy-all.sh
    bash -n scripts/deploy-all.sh
    echo "Master deployment script syntax check passed."
