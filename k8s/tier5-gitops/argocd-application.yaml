apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-application-application
name: enterprise-microservices-platform
namespace: enterprise-core
finalizers:
- resources-finalizer.argocd.argoproj.io
spec: null
project: default
source: null
repoURL: https://github.com/vineethreddy761-lab/enterprise-microservices-platform.git
targetRevision: HEAD
path: k8s
destination: null
server: https://kubernetes.default.svc
syncPolicy: null
automated:
  prune: true
  selfHeal: true
syncOptions:
- CreateNamespace=true
- ApplyOutOfSyncOnly=true
retry:
  limit: 5
  backoff:
    duration: 5s
    factor: 2
    maxDuration: 3m
