apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
name: enterprise-microservices-platform
namespace: argocd
finalizers:
- resources-finalizer.argocd.argoproj.io
spec:
project: default
source:
repoURL: "https://github.com/vineethreddy761-lab/enterprise-microservices-platform.git"
targetRevision: HEAD
path: k8s
destination:
server: "https://kubernetes.default.svc"
namespace: enterprise-core
syncPolicy:
automated:
  prune: true
  selfHeal: true
syncOptions:
  - CreateNamespace=true
  - ApplyOutOfSyncOnly=true
retry:
  limit: 5
  backoff:
    duration: 5s
    factor: 2
    maxDuration: 3m
