apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-policy-deployment
name: core-business-api
namespace: enterprise-backend
spec: null
targetRef: null
service: null
port: 8080
gateways:
- public-gateway.istio-system.svc.cluster.local
hosts:
- api.enterprise.local
analysis: null
interval: 10s
threshold: 5
maxWeight: 50
stepWeight: 10
metrics:
- name: request-success-rate
  thresholdRange:
    min: 99.0
  interval: 30s
- name: request-duration
  thresholdRange:
    max: 500
  interval: 30s
