apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
name: core-business-api
namespace: enterprise-backend
spec:
targetRef:
apiVersion: apps/v1
kind: Deployment
name: core-business-api
service:
port: 8080
gateways:
- public-gateway.istio-system.svc.cluster.local
hosts:
- api.enterprise.local
analysis:
interval: 10s
threshold: 5
maxWeight: 50
stepWeight: 10
metrics:
- name: request-success-rate
  thresholdRange:
    min: 99.0
  interval: 30s
- name: request-duration
  thresholdRange:
    max: 500
  interval: 30s
