apiVersion: v1
kind: ConfigMap
metadata:
name: grafana-dashboards
namespace: enterprise-control-plane
data:
enterprise-overview.json: |
{
  "dashboard": {
    "title": "Enterprise Multi-Tier Observability Overview",
    "panels": [
      {
        "title": "Tier 1: Ingress Gateway Request Rate & Latency",
        "type": "timeseries",
        "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 }
      },
      {
        "title": "Tier 2: Backend Priority Pool Resource Utilization",
        "type": "timeseries",
        "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 }
      },
      {
        "title": "Tier 3: PostgreSQL Active Connections & Lag",
        "type": "stat",
        "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 }
      },
      {
        "title": "Tier 4: Vault Secret Injections & Dynamic Token TTLs",
        "type": "bargauge",
        "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 }
      }
    ],
    "refresh": "10s"
  }
}
