apiVersion: v1
kind: ConfigMap
metadata:
name: grafana-dashboards-config
namespace: enterprise-observability
data:
dashboard-title: "Enterprise Microservices Overview"
dashboard-timezone: "browser"
---
apiVersion: apps/v1
kind: Deployment
metadata:
name: grafana
namespace: enterprise-observability
spec:
replicas: 1
selector:
matchLabels:
  app: grafana
template:
metadata:
  labels:
    app: grafana
spec:
  containers:
  - name: grafana
    image: grafana/grafana:latest
    ports:
    - containerPort: 3000
      name: http
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
