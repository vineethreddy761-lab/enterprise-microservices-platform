apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-configmap-1
name: grafana-dashboards-config
namespace: enterprise-observability
data: null
dashboard-title: Enterprise Microservices Overview
dashboard-timezone: browser
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: grafana
  name: grafana-dashboards-deployment-2
name: grafana
namespace: enterprise-observability
spec:
  containers:
  - name: grafana
    image: grafana/grafana:latest
    ports:
    - containerPort: 3000
      name: http
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
replicas: 1
selector: null
matchLabels:
  app: grafana
template: null
