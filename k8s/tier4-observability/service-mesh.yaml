apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: service-mesh-peerauthentication-1
name: default-strict-mtls
namespace: enterprise-core
spec: null
mtls: null
mode: STRICT
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: service-mesh-virtualservice-2
name: enterprise-platform-routing
namespace: enterprise-ingress
spec: null
hosts:
- platform.enterprise.local
gateways:
- enterprise-gateway
http:
- match: null
- uri:
    prefix: /api/v1
route:
- destination:
    host: backend-service.enterprise-backend.svc.cluster.local
    port:
      number: 8080
  weight: 100
