apiVersion: apps/v1
kind: Deployment
metadata:
name: vault
namespace: enterprise-control-plane
spec:
replicas: 1
selector:
matchLabels:
  app: vault
template:
metadata:
  labels:
    app: vault
spec:
  containers:
  - name: vault
    image: hashicorp/vault:1.15.2
    ports:
    - containerPort: 8200
      name: vault-port
    securityContext:
      capabilities:
        add: ["IPC_LOCK"]
    env:
    - name: VAULT_DEV_ROOT_TOKEN_ID
      value: "enterprise-root-token-change-me"
    - name: VAULT_DEV_LISTEN_ADDRESS
      value: "0.0.0.0:8200"
---
apiVersion: v1
kind: Service
metadata:
name: vault-service
namespace: enterprise-control-plane
spec:
selector:
app: vault
ports:
- port: 8200
targetPort: 8200
type: ClusterIP
