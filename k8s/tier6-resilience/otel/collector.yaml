apiVersion: v1
kind: ConfigMap
metadata:
name: otel-collector-conf
namespace: enterprise-observability
data:
otel-collector-config.yaml: |
receivers:
  otlp:
    protocols:
      grpc:
      http:
processors:
  batch:
exporters:
  logging:
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
---
apiVersion: apps/v1
kind: Deployment
metadata:
name: otel-collector
namespace: enterprise-observability
spec:
replicas: 1
selector:
matchLabels:
  app: otel-collector
template:
metadata:
  labels:
    app: otel-collector
spec:
  containers:
  - name: otel-collector
    image: otel/opentelemetry-collector:latest
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
