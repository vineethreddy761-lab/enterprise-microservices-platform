apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
name: enterprise-backend-circuit-breaker
namespace: enterprise-core
spec:
host: backend-service.enterprise-backend.svc.cluster.local
trafficPolicy:
connectionPool:
  tcp:
    maxConnections: 1024
  http:
    http1MaxPendingRequests: 100
    maxRequestsPerConnection: 10
outlierDetection:
  consecutive5xxErrors: 3
  interval: 10s
  baseEjectionTime: 30s
  maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
name: enterprise-database-circuit-breaker
namespace: enterprise-data
spec:
host: database-service.enterprise-data.svc.cluster.local
trafficPolicy:
connectionPool:
  tcp:
    maxConnections: 512
  http:
    http1MaxPendingRequests: 50
outlierDetection:
  consecutive5xxErrors: 2
  interval: 5s
  baseEjectionTime: 15s
  maxEjectionPercent: 100
