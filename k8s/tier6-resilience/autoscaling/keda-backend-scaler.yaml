apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
name: backend-service-scaler
namespace: enterprise-backend
spec:
scaleTargetRef:
apiVersion: apps/v1
kind: Deployment
name: core-business-api
minReplicaCount: 2
maxReplicaCount: 20
cooldownPeriod: 300
pollingInterval: 15
triggers:
- type: prometheus
metadata:
  serverAddress: http://prometheus-service.enterprise-control-plane.svc.cluster.local:9090
  metricName: http_requests_total
  query: sum(rate(http_requests_total{namespace="enterprise-backend"}[2m]))
  threshold: '100'
