apiVersion: apps/v1
kind: Deployment
metadata:
name: velero-backup-agent
namespace: enterprise-control-plane
spec:
replicas: 1
selector:
matchLabels:
  app: velero-backup
template:
metadata:
  labels:
    app: velero-backup
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: topology.kubernetes.io/tier
            operator: In
            values:
            - backup
  containers:
  - name: velero
    image: velero/velero:v1.12.0
    command:
    - /velero
    - server
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
