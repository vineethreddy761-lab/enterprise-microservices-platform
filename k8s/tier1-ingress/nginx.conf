events { worker_connections 1024; }

http {
# Rate limiting zone: 10 requests per second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

upstream backend_tier2 {
    server internal-backend-service.enterprise.svc.cluster.local:8080;
}

server {
    listen 80;
    listen 443 ssl;
    server_name api.enterprise.local;

    # SSL/TLS Termination Placeholders
    # ssl_certificate /etc/nginx/certs/tls.crt;
    # ssl_certificate_key /etc/nginx/certs/tls.key;

    # WAF Simulation: Block suspicious query strings (SQLi / XSS)
    if ($query_string ~* "(union.*select|exec.*urbin|<script>|drop.*table)") {
        return 403;
    }

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://backend_tier2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
}
