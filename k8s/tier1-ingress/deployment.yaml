apiVersion: apps/v1
kind: Deployment
metadata:
name: enterprise-ingress-gateway
namespace: enterprise-ingress
spec:
replicas: 2
selector:
matchLabels:
  app: ingress-gateway
template:
metadata:
  labels:
    app: ingress-gateway
spec:
  containers:
  - name: nginx
    image: nginx:alpine
    ports:
    - containerPort: 80
      name: http
    - containerPort: 443
      name: https
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
