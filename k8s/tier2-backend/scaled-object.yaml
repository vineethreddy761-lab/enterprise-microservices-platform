apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: enterprise-backend-scaler
spec:
  scaleTargetRef:
    name: enterprise-backend
  minReplicaCount: 1
  maxReplicaCount: 5
  cooldownPeriod: 300
  pollingInterval: 30
  triggers:
  - type: cpu
    metricType: Utilization
    metadata:
      value: "60"
