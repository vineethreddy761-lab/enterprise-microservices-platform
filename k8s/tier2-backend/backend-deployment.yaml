apiVersion: apps/v1
kind: Deployment
metadata:
name: core-business-api
namespace: enterprise-backend
spec:
replicas: 5
selector:
matchLabels:
  app: core-business-api
template:
metadata:
  labels:
    app: core-business-api
spec:
  priorityClassName: core-business-priority
  containers:
  - name: api-server
    image: python:3.11-slim
    command: ["python", "-m", "http.server", "8080"]
    ports:
    - containerPort: 8080
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
name: internal-backend-service
namespace: enterprise-backend
spec:
selector:
app: core-business-api
ports:
- port: 8080
targetPort: 8080
type: ClusterIP
