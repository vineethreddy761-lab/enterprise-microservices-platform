apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-backend
  labels:
    app: enterprise-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enterprise-backend
  template:
    metadata:
      labels:
        app: enterprise-backend
    spec:
      containers:
      - name: backend-service
        image: enterprise-backend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-backend-svc
  labels:
    app: enterprise-backend
spec:
  type: ClusterIP
  selector:
    app: enterprise-backend
  ports:
  - port: 8080
    targetPort: 8080
