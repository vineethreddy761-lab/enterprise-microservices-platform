apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enterprise-backend
  template:
    metadata:
      labels:
        app: enterprise-backend
    spec:
      containers:
      - name: enterprise-backend
        image: enterprise-backend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          value: "enterprise-database-svc"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "enterprise"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "secretpassword"
