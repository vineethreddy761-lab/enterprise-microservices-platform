apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srestrictedcontainers
spec:
  crd:
    spec:
      names:
        kind: K8sRestrictedContainers
      validation:
        openAPIV3Schema:
          type: object
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srestrictedcontainers
        violation[{"msg": msg}] {
            c := input.review.object.spec.containers[_]
            c.securityContext.privileged == true
            msg := sprintf("Container <%v> is privileged, which is disallowed", [c.name])
        }
