apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: policy-rules-constrainttemplate-1
name: k8srequiredlabels
spec:
  names:
    kind: K8sRequiredLabels
  validation:
    openAPIV3Schema:
      type: object
      properties:
        labels:
          type: array
          items:
            type: string
crd: null
targets:
- target: admission.k8s.gatekeeper.sh
  rego: "package k8srequiredlabels\nviolation[{\"msg\": msg}] {\n  provided := {label\
    \ | input.review.object.metadata.labels[label]}\n  required := {label | label\
    \ := input.parameters.labels[_]}\n  missing := required - provided\n  count(missing)\
    \ > 0\n  msg := sprintf(\"You must provide mandatory labels: %v\", [missing])\n\
    }\n"
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredLabels
metadata:
  name: policy-rules-k8srequiredlabels-2
name: all-namespaces-must-have-tier
spec: null
match: null
kinds:
- apiGroups:
  - ''
  kinds:
  - Namespace
parameters: null
labels:
- tier
- environment
