apiVersion: apps/v1
kind: Deployment
metadata:
name: enterprise-ai-inference
namespace: enterprise-backend
spec:
replicas: 1
selector:
matchLabels:
  app: ai-inference
template:
metadata:
  labels:
    app: ai-inference
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: topology.kubernetes.io/tier
            operator: In
            values:
            - aiml
  containers:
  - name: inference-engine
    image: python:3.11-slim
    command: ["python", "-c", "import time; print('AI Inference Engine Running...'); time.sleep(3600)"]
    resources:
      requests:
        cpu: "2000m"
        memory: "8Gi"
      limits:
        cpu: "4000m"
        memory: "16Gi"
        nvidia.com/gpu: "1"
