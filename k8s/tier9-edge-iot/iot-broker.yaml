apiVersion: apps/v1
kind: Deployment
metadata:
name: enterprise-iot-broker
namespace: enterprise-ingress
spec:
replicas: 2
selector:
matchLabels:
  app: iot-broker
template:
metadata:
  labels:
    app: iot-broker
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: topology.kubernetes.io/tier
            operator: In
            values:
            - edge-iot
  containers:
  - name: mosquitto
    image: eclipse-mosquitto:latest
    ports:
    - containerPort: 1883
      name: mqtt
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
name: iot-broker-service
namespace: enterprise-ingress
spec:
type: LoadBalancer
selector:
app: iot-broker
ports:
- port: 1883
targetPort: 1883
name: mqtt
