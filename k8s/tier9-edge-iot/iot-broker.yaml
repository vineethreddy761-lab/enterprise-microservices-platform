apiVersion: apps/v1
kind: Deployment
metadata:
name: enterprise-iot-broker
namespace: enterprise-iot
labels:
app: mqtt-broker
tier: tier9-edge-iot
spec:
replicas: 2
selector:
matchLabels:
  app: mqtt-broker
template:
metadata:
  labels:
    app: mqtt-broker
spec:
  containers:
  - name: mosquitto
    image: eclipse-mosquitto:2.0
    ports:
    - containerPort: 1883
      name: mqtt
    - containerPort: 9001
      name: websockets
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    readinessProbe:
      tcpSocket:
        port: 1883
      initialDelaySeconds: 5
      periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
name: iot-broker-service
namespace: enterprise-iot
spec:
selector:
app: mqtt-broker
ports:
- port: 1883
targetPort: 1883
name: mqtt
- port: 9001
targetPort: 9001
name: websockets
type: ClusterIP
