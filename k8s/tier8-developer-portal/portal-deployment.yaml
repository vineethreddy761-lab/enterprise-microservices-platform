apiVersion: apps/v1
kind: Deployment
metadata:
name: enterprise-developer-portal
namespace: enterprise-portal
labels:
app: developer-portal
tier: tier8-developer-portal
spec:
replicas: 2
selector:
matchLabels:
  app: developer-portal
template:
metadata:
  labels:
    app: developer-portal
spec:
  containers:
  - name: backstage-portal
    image: node:18-alpine
    command: ["node", "packages/backend", "--config", "app-config.yaml"]
    ports:
    - containerPort: 7000
      name: http-portal
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"
    readinessProbe:
      httpGet:
        path: /healthcheck
        port: 7000
      initialDelaySeconds: 20
      periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
name: developer-portal-service
namespace: enterprise-portal
spec:
selector:
app: developer-portal
ports:
- port: 80
targetPort: 7000
name: http
type: ClusterIP
