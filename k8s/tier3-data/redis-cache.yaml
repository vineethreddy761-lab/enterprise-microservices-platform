apiVersion: apps/v1
kind: Deployment
metadata:
name: enterprise-cache-cluster
namespace: enterprise-data
spec:
replicas: 2
selector:
matchLabels:
  app: redis-cache
template:
metadata:
  labels:
    app: redis-cache
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: topology.kubernetes.io/tier
            operator: In
            values:
            - cache
  containers:
  - name: redis
    image: redis:7.2-alpine
    command: ["redis-server", "--maxmemory", "4gb", "--maxmemory-policy", "allkeys-lru"]
    ports:
    - containerPort: 6379
      name: redis
    resources:
      requests:
        cpu: "1000m"
        memory: "2Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
name: cache-service
namespace: enterprise-data
spec:
ports:
- port: 6379
targetPort: 6379
selector:
app: redis-cache
