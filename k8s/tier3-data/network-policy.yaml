apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
name: restrict-database-access
namespace: enterprise-data
spec:
podSelector:
matchLabels:
  app: postgres-db
policyTypes:
- Ingress
ingress:
- from:
- namespaceSelector:
    matchLabels:
      environment: enterprise-backend
ports:
- protocol: TCP
  port: 5432
