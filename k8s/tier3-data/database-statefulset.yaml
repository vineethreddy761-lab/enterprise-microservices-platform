apiVersion: apps/v1
kind: StatefulSet
metadata:
name: postgres-cluster
namespace: enterprise-data
spec:
serviceName: "postgres-internal"
replicas: 2
selector:
matchLabels:
  app: postgres-db
template:
metadata:
  labels:
    app: postgres-db
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: topology.kubernetes.io/tier
            operator: In
            values:
            - data
  containers:
  - name: postgres
    image: postgres:15-alpine
    ports:
    - containerPort: 5432
      name: postgres
    env:
    - name: POSTGRES_DB
      value: enterprise_core
    - name: POSTGRES_USER
      valueFrom:
        secretKeyRef:
          name: db-secret
          key: username
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: db-secret
          key: password
    resources:
      requests:
        cpu: "1000m"
        memory: "2Gi"
      limits:
        cpu: "4000m"
        memory: "8Gi"
---
apiVersion: v1
kind: Service
metadata:
name: postgres-internal
namespace: enterprise-data
spec:
ports:
- port: 5432
targetPort: 5432
clusterIP: None
selector:
app: postgres-db
